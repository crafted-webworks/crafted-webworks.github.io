<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Crafted WebWorks — custom website and web application development">
  <title>Crafted WebWorks — custom website and web application development</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8CFF"/>
      <stop offset="1" stop-color="#0C4FBF"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F26F0A"/>
      <stop offset="1" stop-color="#FFAC5C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B7FFF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FF8A1E"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2B7FFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2B7FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A1E" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FF8A1E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="120" cy="90" r="360" fill="url(#glowBlue)"/>
  <circle cx="1110" cy="560" r="320" fill="url(#glowOrange)"/>

  <!-- Brand mark -->
  <g transform="translate(88 96)">
    <rect x="0" y="4" width="84" height="62" rx="16" fill="none" stroke="url(#blue)" stroke-width="4"/>
    <path d="M0 22h84" stroke="url(#blue)" stroke-width="3" opacity="0.5"/>
    <circle cx="14" cy="13" r="3.2" fill="#FF8A1E"/>
    <circle cx="26" cy="13" r="3.2" fill="#4C8CFF"/>
    <path d="M34 36 24 44l10 8" fill="none" stroke="#E3EAF7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m50 36 10 8-10 8" fill="none" stroke="url(#orange)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m46 33-7 22" stroke="#E3EAF7" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <text x="196" y="150" font-family="Sora, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    Crafted<tspan fill="#FF8A1E">WebWorks</tspan>
  </text>

  <!-- Headline -->
  <text x="88" y="300" font-family="Sora, Segoe UI, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="-2.4">Websites crafted for</text>
  <text x="88" y="384" font-family="Sora, Segoe UI, sans-serif" font-size="76" font-weight="700" fill="url(#sweep)" letter-spacing="-2.4">your business.</text>

  <text x="88" y="444" font-family="Inter, Segoe UI, sans-serif" font-size="27" fill="#94A3BF">Custom websites, web applications and digital experiences</text>
  <text x="88" y="482" font-family="Inter, Segoe UI, sans-serif" font-size="27" fill="#94A3BF">built for performance, growth and real-world use.</text>

  <!-- Trust chips -->
  <g font-family="JetBrains Mono, monospace" font-size="19" fill="#A9B7D0">
    <rect x="88" y="524" width="150" height="46" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="163" y="553" text-anchor="middle">Custom</text>

    <rect x="252" y="524" width="182" height="46" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="343" y="553" text-anchor="middle">Responsive</text>

    <rect x="448" y="524" width="176" height="46" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="536" y="553" text-anchor="middle">SEO Ready</text>

    <rect x="638" y="524" width="210" height="46" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="743" y="553" text-anchor="middle">Performance</text>
  </g>

  <!-- Decorative code window -->
  <g transform="translate(848 168)" opacity="0.95">
    <rect x="0" y="0" width="288" height="220" rx="20" fill="#0B1220" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M0 42h288" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="26" cy="21" r="5" fill="#FF6B8B"/>
    <circle cx="44" cy="21" r="5" fill="#FF8A1E"/>
    <circle cx="62" cy="21" r="5" fill="#22C58B"/>
    <rect x="26" y="70" width="150" height="10" rx="5" fill="#2B7FFF" opacity="0.75"/>
    <rect x="26" y="96" width="210" height="10" rx="5" fill="#FFFFFF" opacity="0.16"/>
    <rect x="26" y="122" width="176" height="10" rx="5" fill="#FFFFFF" opacity="0.16"/>
    <rect x="26" y="148" width="120" height="10" rx="5" fill="#FF8A1E" opacity="0.7"/>
    <rect x="26" y="174" width="196" height="10" rx="5" fill="#FFFFFF" opacity="0.1"/>
  </g>

  <path d="M0 620h1200" stroke="url(#sweep)" stroke-width="6"/>
</svg>
