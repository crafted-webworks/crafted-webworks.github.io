<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Maker</title>
<meta name="description" content="Build a simple vector logo from a shape, your brand name and a tagline — pick colors and a layout, then export as PNG or SVG. Entirely in your browser.">

<!--
  Fully self-contained tool. Nothing here references the parent site's
  assets/js or assets/css — this whole folder can be copied into another
  project, opened directly from disk, or dropped into an <iframe> and it
  will keep working exactly as it does today.
-->
<script>
  /* Cache-busted on every load — this tool is opened inside an iframe
     that's itself cache-busted (see tools.js → framedTool), and this is
     the other half of that: without it, the *referenced* style.css/
     app.js could still be served from an old cached copy even though the
     document embedding them is fresh. See tools/STANDARDS.md. */
  document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
</head>
<body>

  <header class="lm-appbar">
    <div class="lm-appbar-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 1-4.5 4.5L17.5 20 12 17l-5.5 3 1-6.5L3 9l6-1 3-6z"/></svg>
      Logo Maker
    </div>
    <!-- Reserved clearance for the host's floating fullscreen restore/close
         controls (top-right, ~84px wide) — see tools/STANDARDS.md §5. -->
  </header>

  <main class="lm">
    <div class="lm-card lm-controls">

      <div class="lm-tabs" data-section-tabs role="tablist" aria-label="Logo settings">
        <button type="button" class="lm-tab is-active" data-section="icon" role="tab" aria-selected="true">Icon</button>
        <button type="button" class="lm-tab" data-section="text" role="tab" aria-selected="false">Text</button>
        <button type="button" class="lm-tab" data-section="colors" role="tab" aria-selected="false">Colors</button>
        <button type="button" class="lm-tab" data-section="layout" role="tab" aria-selected="false">Layout</button>
      </div>

      <!-- ICON -->
      <div class="lm-pane is-active" data-section-pane="icon">
        <div class="lm-field">
          <label>Icon shape</label>
          <div class="lm-card-group lm-card-group--icons" data-choice="icon" id="lm-icon-grid"></div>
        </div>
      </div>

      <!-- TEXT -->
      <div class="lm-pane" data-section-pane="text">
        <div class="lm-field">
          <label for="lm-name">Brand name</label>
          <input type="text" id="lm-name" placeholder="Acme Studio" value="Acme Studio" maxlength="40">
        </div>
        <div class="lm-field">
          <label for="lm-tagline">Tagline <span class="lm-hint">optional</span></label>
          <input type="text" id="lm-tagline" placeholder="Est. 2024" maxlength="50">
        </div>
        <div class="lm-row">
          <div class="lm-field">
            <label for="lm-font-family">Font</label>
            <select id="lm-font-family">
              <option value="system-ui" selected>System UI (sans)</option>
              <option value="helvetica">Helvetica / Arial (sans)</option>
              <option value="trebuchet">Trebuchet MS (rounded)</option>
              <option value="georgia">Georgia (serif)</option>
              <option value="times">Times New Roman (serif)</option>
              <option value="verdana">Verdana (sans)</option>
              <option value="courier">Courier New (mono)</option>
            </select>
          </div>
          <div class="lm-field">
            <label for="lm-font-weight">Weight</label>
            <select id="lm-font-weight">
              <option value="400">Regular</option>
              <option value="600">Medium</option>
              <option value="700" selected>Bold</option>
              <option value="800">Extra Bold</option>
            </select>
          </div>
        </div>
        <div class="lm-field">
          <label for="lm-letter-spacing">Letter spacing <span class="lm-hint" id="lm-letter-spacing-val">2px</span></label>
          <input type="range" id="lm-letter-spacing" min="-4" max="24" step="1" value="2">
        </div>
      </div>

      <!-- COLORS -->
      <div class="lm-pane" data-section-pane="colors">
        <div class="lm-field">
          <label>Icon color</label>
          <div class="lm-swatch-row" data-swatches="icon">
            <button type="button" class="lm-swatch is-active" style="--sw:#1f1c17" data-value="#1f1c17" aria-label="Ink"></button>
            <button type="button" class="lm-swatch" style="--sw:#e0402b" data-value="#e0402b" aria-label="Red"></button>
            <button type="button" class="lm-swatch" style="--sw:#2b7fff" data-value="#2b7fff" aria-label="Blue"></button>
            <button type="button" class="lm-swatch" style="--sw:#1f9d55" data-value="#1f9d55" aria-label="Green"></button>
            <button type="button" class="lm-swatch" style="--sw:#8b3dd1" data-value="#8b3dd1" aria-label="Purple"></button>
            <button type="button" class="lm-swatch" style="--sw:#e2972e" data-value="#e2972e" aria-label="Gold"></button>
            <button type="button" class="lm-swatch lm-swatch--custom" data-custom-for="icon" aria-label="Custom color">
              <input type="color" id="lm-icon-color-custom" value="#1f1c17" tabindex="-1" aria-hidden="true">
            </button>
          </div>
        </div>

        <div class="lm-field">
          <label>Text color</label>
          <div class="lm-swatch-row" data-swatches="text">
            <button type="button" class="lm-swatch is-active" style="--sw:#1f1c17" data-value="#1f1c17" aria-label="Ink"></button>
            <button type="button" class="lm-swatch" style="--sw:#e0402b" data-value="#e0402b" aria-label="Red"></button>
            <button type="button" class="lm-swatch" style="--sw:#2b7fff" data-value="#2b7fff" aria-label="Blue"></button>
            <button type="button" class="lm-swatch" style="--sw:#1f9d55" data-value="#1f9d55" aria-label="Green"></button>
            <button type="button" class="lm-swatch" style="--sw:#8b3dd1" data-value="#8b3dd1" aria-label="Purple"></button>
            <button type="button" class="lm-swatch" style="--sw:#e2972e" data-value="#e2972e" aria-label="Gold"></button>
            <button type="button" class="lm-swatch lm-swatch--custom" data-custom-for="text" aria-label="Custom color">
              <input type="color" id="lm-text-color-custom" value="#1f1c17" tabindex="-1" aria-hidden="true">
            </button>
          </div>
        </div>

        <div class="lm-field">
          <label>Background</label>
          <div class="lm-fill-mode" data-fill-mode="bg">
            <button type="button" class="lm-mode-btn is-active" data-mode="transparent">Transparent</button>
            <button type="button" class="lm-mode-btn" data-mode="solid">Solid</button>
          </div>
          <div class="lm-swatch-row" data-swatches="bg" data-fill-panel="bg-solid" hidden>
            <button type="button" class="lm-swatch is-active" style="--sw:#ffffff" data-value="#ffffff" aria-label="White"></button>
            <button type="button" class="lm-swatch" style="--sw:#1f1c17" data-value="#1f1c17" aria-label="Black"></button>
            <button type="button" class="lm-swatch" style="--sw:#dbe9ff" data-value="#dbe9ff" aria-label="Light blue"></button>
            <button type="button" class="lm-swatch" style="--sw:#fdf1cf" data-value="#fdf1cf" aria-label="Light gold"></button>
            <button type="button" class="lm-swatch lm-swatch--custom" data-custom-for="bg" aria-label="Custom color">
              <input type="color" id="lm-bg-color-custom" value="#ffffff" tabindex="-1" aria-hidden="true">
            </button>
          </div>
        </div>
      </div>

      <!-- LAYOUT -->
      <div class="lm-pane" data-section-pane="layout">
        <div class="lm-field">
          <label>Arrangement</label>
          <div class="lm-card-group" data-choice="layout" id="lm-layout-grid">
            <button type="button" class="lm-choice-card" data-value="icon-above-text">
              <span class="lm-layout-mini" data-preview="icon-above-text"><i></i><b></b><b class="lm-b2"></b></span>
              <span>Icon above text</span>
            </button>
            <button type="button" class="lm-choice-card is-active" data-value="icon-left-of-text">
              <span class="lm-layout-mini" data-preview="icon-left-of-text"><i></i><span class="lm-mini-lines"><b></b><b class="lm-b2"></b></span></span>
              <span>Icon left of text</span>
            </button>
            <button type="button" class="lm-choice-card" data-value="text-only">
              <span class="lm-layout-mini" data-preview="text-only"><b></b><b class="lm-b2"></b></span>
              <span>Text only</span>
            </button>
            <button type="button" class="lm-choice-card" data-value="icon-only">
              <span class="lm-layout-mini" data-preview="icon-only"><i class="lm-i-big"></i></span>
              <span>Icon only</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <div class="lm-card lm-preview">
      <div class="lm-canvas-wrap">
        <canvas id="lm-canvas" width="1000" height="1000"></canvas>
      </div>

      <div class="lm-tabs lm-tabs--format" data-format-tabs role="tablist" aria-label="Download format">
        <button type="button" class="lm-tab is-active" data-format="png" role="tab" aria-selected="true">PNG</button>
        <button type="button" class="lm-tab" data-format="svg" role="tab" aria-selected="false">SVG</button>
      </div>

      <button type="button" class="lm-btn lm-btn--dark lm-download" id="lm-download">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Download Logo
      </button>
    </div>

  </main>

<script>
  (function () {
    var v = Date.now();
    document.write('<script src="app.js?v=' + v + '"><' + '/script>');
  })();
</script>
</body>
</html>
