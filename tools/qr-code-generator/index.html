<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator</title>
<meta name="description" content="Generate a custom QR code for a website, text, Wi-Fi, email, phone number or SMS — with colors, styles and a logo — entirely in your browser.">

<!--
  Fully self-contained tool. Nothing here references the parent site's
  assets/js or assets/css — this whole folder can be copied into another
  project, opened directly from disk, or dropped into an <iframe> and it
  will keep working exactly as it does today.
-->
<script>
  /* Cache-busted on every load — this tool is opened inside an iframe
     that's itself cache-busted (see tools.js → framedTool), and this is
     the other half of that: without it, the *referenced* style.css/
     app.js could still be served from an old cached copy even though the
     document embedding them is fresh. See tools/STANDARDS.md. */
  document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
</head>
<body>

  <main class="qr">
    <div class="qr-card qr-controls">

      <div class="qr-tabs" data-type-tabs role="tablist" aria-label="Content type">
        <button type="button" class="qr-tab is-active" data-type="website" role="tab" aria-selected="true">Website</button>
        <button type="button" class="qr-tab" data-type="text" role="tab" aria-selected="false">Text</button>
        <button type="button" class="qr-tab" data-type="wifi" role="tab" aria-selected="false">WiFi</button>
        <button type="button" class="qr-tab" data-type="email" role="tab" aria-selected="false">Email</button>
        <button type="button" class="qr-tab" data-type="phone" role="tab" aria-selected="false">Phone</button>
        <button type="button" class="qr-tab" data-type="sms" role="tab" aria-selected="false">SMS</button>
      </div>

      <div class="qr-type-panes">
        <div class="qr-type-pane is-active" data-type-pane="website">
          <div class="qr-field">
            <label for="qr-website-url">Website URL</label>
            <div class="qr-input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <input type="text" id="qr-website-url" placeholder="https://example.com" value="https://example.com">
            </div>
          </div>
        </div>

        <div class="qr-type-pane" data-type-pane="text">
          <div class="qr-field">
            <label for="qr-text-value">Text</label>
            <textarea id="qr-text-value" rows="3" placeholder="Anything you want encoded"></textarea>
          </div>
        </div>

        <div class="qr-type-pane" data-type-pane="wifi">
          <div class="qr-field">
            <label for="qr-wifi-ssid">Network name (SSID)</label>
            <input type="text" id="qr-wifi-ssid" placeholder="My WiFi">
          </div>
          <div class="qr-row">
            <div class="qr-field">
              <label for="qr-wifi-password">Password</label>
              <input type="text" id="qr-wifi-password" placeholder="••••••••">
            </div>
            <div class="qr-field">
              <label for="qr-wifi-security">Security</label>
              <select id="qr-wifi-security">
                <option value="WPA" selected>WPA / WPA2</option>
                <option value="WEP">WEP</option>
                <option value="nopass">None (open)</option>
              </select>
            </div>
          </div>
          <label class="qr-check">
            <input type="checkbox" id="qr-wifi-hidden">
            <span>Hidden network</span>
          </label>
        </div>

        <div class="qr-type-pane" data-type-pane="email">
          <div class="qr-field">
            <label for="qr-email-to">To</label>
            <input type="text" id="qr-email-to" placeholder="hello@example.com">
          </div>
          <div class="qr-field">
            <label for="qr-email-subject">Subject</label>
            <input type="text" id="qr-email-subject" placeholder="Subject">
          </div>
          <div class="qr-field">
            <label for="qr-email-body">Message</label>
            <textarea id="qr-email-body" rows="2" placeholder="Optional message"></textarea>
          </div>
        </div>

        <div class="qr-type-pane" data-type-pane="phone">
          <div class="qr-field">
            <label for="qr-phone-number">Phone number</label>
            <input type="text" id="qr-phone-number" placeholder="+1 555 123 4567">
          </div>
        </div>

        <div class="qr-type-pane" data-type-pane="sms">
          <div class="qr-field">
            <label for="qr-sms-number">Phone number</label>
            <input type="text" id="qr-sms-number" placeholder="+1 555 123 4567">
          </div>
          <div class="qr-field">
            <label for="qr-sms-message">Message</label>
            <textarea id="qr-sms-message" rows="2" placeholder="Optional message"></textarea>
          </div>
        </div>
      </div>

      <div class="qr-divider">Customize</div>

      <div class="qr-field">
        <label>QR Style</label>
        <div class="qr-card-group" data-choice="dotStyle">
          <button type="button" class="qr-choice-card is-active" data-value="square">
            <span class="qr-choice-icon" data-preview="square"></span>
            <span>Classic</span>
          </button>
          <button type="button" class="qr-choice-card" data-value="rounded">
            <span class="qr-choice-icon" data-preview="rounded"></span>
            <span>Rounded</span>
          </button>
          <button type="button" class="qr-choice-card" data-value="dots">
            <span class="qr-choice-icon" data-preview="dots"></span>
            <span>Dots</span>
          </button>
        </div>
      </div>

      <div class="qr-field">
        <label>Foreground Color</label>
        <div class="qr-fill-mode" data-fill-mode="dots">
          <button type="button" class="qr-mode-btn is-active" data-mode="solid">Solid</button>
          <button type="button" class="qr-mode-btn" data-mode="gradient">Gradient</button>
        </div>
        <div class="qr-swatch-row" data-swatches="dots" data-fill-panel="dots-solid">
          <button type="button" class="qr-swatch is-active" style="--sw:#111318" data-value="#111318" aria-label="Black"></button>
          <button type="button" class="qr-swatch" style="--sw:#7a3b2e" data-value="#7a3b2e" aria-label="Brown"></button>
          <button type="button" class="qr-swatch" style="--sw:#e0402b" data-value="#e0402b" aria-label="Red"></button>
          <button type="button" class="qr-swatch" style="--sw:#2b7fff" data-value="#2b7fff" aria-label="Blue"></button>
          <button type="button" class="qr-swatch" style="--sw:#1f9d55" data-value="#1f9d55" aria-label="Green"></button>
          <button type="button" class="qr-swatch" style="--sw:#8b3dd1" data-value="#8b3dd1" aria-label="Purple"></button>
          <button type="button" class="qr-swatch" style="--sw:#e2972e" data-value="#e2972e" aria-label="Gold"></button>
          <button type="button" class="qr-swatch qr-swatch--custom" data-custom-for="dots" aria-label="Custom color">
            <input type="color" id="qr-color-dots" value="#111318" tabindex="-1" aria-hidden="true">
          </button>
        </div>
        <div class="qr-gradient-row" data-fill-panel="dots-gradient" hidden>
          <input type="color" data-gradient-from="dots" value="#2b7fff" aria-label="Gradient start color">
          <input type="color" data-gradient-to="dots" value="#ff8a1e" aria-label="Gradient end color">
          <div class="qr-angle-dial" data-angle-dial="dots">
            <div class="qr-angle-face" role="slider" aria-label="Gradient angle" aria-valuemin="0" aria-valuemax="360" aria-valuenow="45" tabindex="0">
              <div class="qr-angle-handle"></div>
            </div>
            <span class="qr-angle-value" data-angle-value="dots">45°</span>
          </div>
        </div>
      </div>

      <div class="qr-field">
        <label>Background Color</label>
        <div class="qr-fill-mode" data-fill-mode="bg">
          <button type="button" class="qr-mode-btn is-active" data-mode="solid">Solid</button>
          <button type="button" class="qr-mode-btn" data-mode="gradient">Gradient</button>
        </div>
        <div class="qr-swatch-row" data-swatches="bg" data-fill-panel="bg-solid">
          <button type="button" class="qr-swatch is-active" style="--sw:#ffffff" data-value="#ffffff" aria-label="White"></button>
          <button type="button" class="qr-swatch" style="--sw:#dbe9ff" data-value="#dbe9ff" aria-label="Light blue"></button>
          <button type="button" class="qr-swatch" style="--sw:#dcf3e3" data-value="#dcf3e3" aria-label="Light green"></button>
          <button type="button" class="qr-swatch" style="--sw:#fdf1cf" data-value="#fdf1cf" aria-label="Light gold"></button>
          <button type="button" class="qr-swatch qr-swatch--custom" data-custom-for="bg" aria-label="Custom color">
            <input type="color" id="qr-color-bg" value="#ffffff" tabindex="-1" aria-hidden="true">
          </button>
        </div>
        <div class="qr-gradient-row" data-fill-panel="bg-gradient" hidden>
          <input type="color" data-gradient-from="bg" value="#ffffff" aria-label="Gradient start color">
          <input type="color" data-gradient-to="bg" value="#dbe9ff" aria-label="Gradient end color">
          <div class="qr-angle-dial" data-angle-dial="bg">
            <div class="qr-angle-face" role="slider" aria-label="Gradient angle" aria-valuemin="0" aria-valuemax="360" aria-valuenow="45" tabindex="0">
              <div class="qr-angle-handle"></div>
            </div>
            <span class="qr-angle-value" data-angle-value="bg">45°</span>
          </div>
        </div>
      </div>

      <div class="qr-field">
        <label>Eye Style</label>
        <div class="qr-card-group" data-choice="eyeStyle">
          <button type="button" class="qr-choice-card" data-value="square">
            <span class="qr-choice-icon" data-preview="eye-square"></span>
            <span>Square</span>
          </button>
          <button type="button" class="qr-choice-card is-active" data-value="rounded">
            <span class="qr-choice-icon" data-preview="eye-rounded"></span>
            <span>Rounded</span>
          </button>
          <button type="button" class="qr-choice-card" data-value="dot">
            <span class="qr-choice-icon" data-preview="eye-dot"></span>
            <span>Circle</span>
          </button>
        </div>
      </div>

      <div class="qr-field">
        <label>Eye Color</label>
        <div class="qr-swatch-row" data-swatches="eyes">
          <button type="button" class="qr-swatch" style="--sw:#111318" data-value="#111318" aria-label="Black"></button>
          <button type="button" class="qr-swatch is-active" style="--sw:#2b7fff" data-value="#2b7fff" aria-label="Blue"></button>
          <button type="button" class="qr-swatch" style="--sw:#e0402b" data-value="#e0402b" aria-label="Red"></button>
          <button type="button" class="qr-swatch" style="--sw:#1f9d55" data-value="#1f9d55" aria-label="Green"></button>
          <button type="button" class="qr-swatch" style="--sw:#e2972e" data-value="#e2972e" aria-label="Gold"></button>
          <button type="button" class="qr-swatch qr-swatch--custom" data-custom-for="eyes" aria-label="Custom color">
            <input type="color" id="qr-color-eyes" value="#2b7fff" tabindex="-1" aria-hidden="true">
          </button>
        </div>
      </div>

      <details class="qr-advanced">
        <summary>Advanced</summary>

        <div class="qr-row">
          <div class="qr-field">
            <label for="qr-size">Size <span class="qr-hint" id="qr-size-val">512px</span></label>
            <input type="range" id="qr-size" min="128" max="1024" step="8" value="512">
          </div>
          <div class="qr-field">
            <label for="qr-margin">Quiet zone <span class="qr-hint" id="qr-margin-val">4</span></label>
            <input type="range" id="qr-margin" min="0" max="10" step="1" value="4">
          </div>
        </div>

        <div class="qr-field">
          <label for="qr-ec">Error correction</label>
          <select id="qr-ec">
            <option value="L">L — recovers ~7%</option>
            <option value="M" selected>M — recovers ~15%</option>
            <option value="Q">Q — recovers ~25%</option>
            <option value="H">H — recovers ~30% (best with a logo)</option>
          </select>
        </div>

        <div class="qr-field">
          <label class="qr-drop" for="qr-logo-file">
            <span class="qr-drop-label" id="qr-logo-label">Add a center logo</span>
            <span class="qr-drop-hint">PNG or JPG</span>
            <input type="file" id="qr-logo-file" accept="image/*" hidden>
          </label>
        </div>

        <div class="qr-row" id="qr-logo-controls" hidden>
          <div class="qr-field">
            <label for="qr-logo-size">Logo size <span class="qr-hint" id="qr-logo-size-val">22%</span></label>
            <input type="range" id="qr-logo-size" min="10" max="30" step="1" value="22">
          </div>
          <button type="button" class="qr-btn qr-btn--ghost" id="qr-logo-remove">Remove logo</button>
        </div>
        <p class="qr-note" id="qr-logo-note" hidden>
          A logo covers part of the code — error correction was raised to <strong>H</strong> so it still scans.
        </p>
      </details>

      <button type="button" class="qr-btn qr-btn--primary qr-generate" id="qr-generate">
        Generate QR Code
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>

    <div class="qr-card qr-preview">
      <div class="qr-canvas-wrap">
        <canvas id="qr-canvas" width="512" height="512"></canvas>
      </div>
      <p class="qr-caption" id="qr-caption">Scan to visit<span class="qr-caption-rule"></span></p>
      <p class="qr-status" id="qr-status" role="status" aria-live="polite"></p>

      <div class="qr-tabs qr-tabs--format" data-format-tabs role="tablist" aria-label="Download format">
        <button type="button" class="qr-tab is-active" data-format="png" role="tab" aria-selected="true">PNG</button>
        <button type="button" class="qr-tab" data-format="svg" role="tab" aria-selected="false">SVG</button>
        <button type="button" class="qr-tab" data-format="pdf" role="tab" aria-selected="false">PDF</button>
      </div>

      <button type="button" class="qr-btn qr-btn--dark qr-download" id="qr-download">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Download QR Code
      </button>
    </div>

  </main>

<script>
  (function () {
    var v = Date.now();
    document.write('<script src="qrcode-lib.js?v=' + v + '"><' + '/script>');
    document.write('<script src="app.js?v=' + v + '"><' + '/script>');
  })();
</script>
</body>
</html>
