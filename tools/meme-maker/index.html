<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme Maker</title>
<meta name="description" content="Upload an image, add classic top/bottom captions or freeform text boxes, and export your meme as a PNG — entirely in your browser.">

<!--
  Fully self-contained tool. Nothing here references the parent site's
  assets/js or assets/css — this whole folder can be copied into another
  project, opened directly from disk, or dropped into an <iframe> and it
  will keep working exactly as it does today.
-->
<script>
  /* Cache-busted on every load — this tool is opened inside an iframe
     that's itself cache-busted (see tools.js → framedTool), and this is
     the other half of that: without it, the *referenced* style.css/
     app.js could still be served from an old cached copy even though the
     document embedding them is fresh. See tools/STANDARDS.md. */
  document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
</head>
<body>

  <div class="mm">

    <header class="mm-header">
      <div class="mm-header-left">
        <h1 class="mm-title">Meme Maker</h1>
      </div>
      <div class="mm-header-right">
        <span class="mm-header-hint">Drag text to move it</span>
      </div>
    </header>

    <div class="mm-body">

      <aside class="mm-sidebar">

        <section class="mm-section">
          <h2 class="mm-section-title">Image</h2>
          <label class="mm-drop" for="mm-file-input" id="mm-dropzone">
            <span class="mm-drop-label" id="mm-drop-label">Click or drop an image</span>
            <span class="mm-drop-hint">PNG or JPG</span>
            <input type="file" id="mm-file-input" accept="image/*" hidden>
          </label>
          <div class="mm-field">
            <label>Or start with a plain canvas</label>
            <div class="mm-swatch-row" id="mm-placeholder-swatches">
              <button type="button" class="mm-swatch is-active" style="--sw:#cfd8dc" data-color="#cfd8dc" aria-label="Light gray"></button>
              <button type="button" class="mm-swatch" style="--sw:#2b2f36" data-color="#2b2f36" aria-label="Dark"></button>
              <button type="button" class="mm-swatch" style="--sw:#fdf1cf" data-color="#fdf1cf" aria-label="Cream"></button>
              <button type="button" class="mm-swatch" style="--sw:#dbe9ff" data-color="#dbe9ff" aria-label="Light blue"></button>
            </div>
          </div>
        </section>

        <section class="mm-section">
          <h2 class="mm-section-title">Classic Captions</h2>
          <div class="mm-field">
            <label for="mm-top-text">Top text</label>
            <input type="text" id="mm-top-text" placeholder="TOP TEXT">
          </div>
          <div class="mm-field">
            <label for="mm-bottom-text">Bottom text</label>
            <input type="text" id="mm-bottom-text" placeholder="BOTTOM TEXT">
          </div>

          <div class="mm-field">
            <label for="mm-caption-fontsize">Font size <span class="mm-hint" id="mm-caption-fontsize-val">54px</span></label>
            <input type="range" id="mm-caption-fontsize" min="16" max="120" step="1" value="54">
          </div>

          <div class="mm-field">
            <label>Fill color</label>
            <div class="mm-swatch-row" data-swatches="caption-fill">
              <button type="button" class="mm-swatch is-active" style="--sw:#ffffff" data-value="#ffffff" aria-label="White"></button>
              <button type="button" class="mm-swatch" style="--sw:#000000" data-value="#000000" aria-label="Black"></button>
              <button type="button" class="mm-swatch" style="--sw:#ffd400" data-value="#ffd400" aria-label="Yellow"></button>
              <button type="button" class="mm-swatch" style="--sw:#ff3b30" data-value="#ff3b30" aria-label="Red"></button>
              <button type="button" class="mm-swatch qr-swatch--custom mm-swatch--custom" data-custom-for="caption-fill" aria-label="Custom color">
                <input type="color" id="mm-caption-fill-custom" value="#ffffff" tabindex="-1" aria-hidden="true">
              </button>
            </div>
          </div>

          <label class="mm-check">
            <input type="checkbox" id="mm-caption-stroke-toggle" checked>
            <span>Outline</span>
          </label>

          <div class="mm-row" id="mm-caption-stroke-controls">
            <div class="mm-field">
              <label>Outline color</label>
              <div class="mm-swatch-row" data-swatches="caption-stroke">
                <button type="button" class="mm-swatch is-active" style="--sw:#000000" data-value="#000000" aria-label="Black"></button>
                <button type="button" class="mm-swatch" style="--sw:#ffffff" data-value="#ffffff" aria-label="White"></button>
                <button type="button" class="mm-swatch qr-swatch--custom mm-swatch--custom" data-custom-for="caption-stroke" aria-label="Custom color">
                  <input type="color" id="mm-caption-stroke-custom" value="#000000" tabindex="-1" aria-hidden="true">
                </button>
              </div>
            </div>
            <div class="mm-field">
              <label for="mm-caption-stroke-width">Width <span class="mm-hint" id="mm-caption-stroke-width-val">6px</span></label>
              <input type="range" id="mm-caption-stroke-width" min="0" max="16" step="1" value="6">
            </div>
          </div>
        </section>

        <section class="mm-section">
          <div class="mm-section-head">
            <h2 class="mm-section-title">Text Boxes</h2>
            <button type="button" class="mm-btn mm-btn--small" id="mm-add-text">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              Add Text
            </button>
          </div>
          <p class="mm-empty" id="mm-boxes-empty">No extra text boxes yet — click "Add Text" to place one anywhere on the image.</p>
          <div class="mm-boxes-list" id="mm-boxes-list"></div>

          <div class="mm-box-editor" id="mm-box-editor" hidden>
            <div class="mm-divider">Selected text box</div>
            <div class="mm-field">
              <label for="mm-box-text">Text</label>
              <textarea id="mm-box-text" rows="2" placeholder="Your text"></textarea>
            </div>
            <div class="mm-field">
              <label for="mm-box-fontsize">Font size <span class="mm-hint" id="mm-box-fontsize-val">36px</span></label>
              <input type="range" id="mm-box-fontsize" min="12" max="120" step="1" value="36">
            </div>
            <div class="mm-field">
              <label>Alignment</label>
              <div class="mm-pill-group" data-align-group>
                <button type="button" class="mm-pill is-active" data-align="left" aria-label="Align left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h14"/></svg>
                </button>
                <button type="button" class="mm-pill" data-align="center" aria-label="Align center">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M5 18h14"/></svg>
                </button>
                <button type="button" class="mm-pill" data-align="right" aria-label="Align right">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M10 12h10"/><path d="M6 18h14"/></svg>
                </button>
              </div>
            </div>
            <div class="mm-field">
              <label>Fill color</label>
              <div class="mm-swatch-row" data-swatches="box-fill">
                <button type="button" class="mm-swatch is-active" style="--sw:#ffffff" data-value="#ffffff" aria-label="White"></button>
                <button type="button" class="mm-swatch" style="--sw:#000000" data-value="#000000" aria-label="Black"></button>
                <button type="button" class="mm-swatch" style="--sw:#ffd400" data-value="#ffd400" aria-label="Yellow"></button>
                <button type="button" class="mm-swatch" style="--sw:#2b7fff" data-value="#2b7fff" aria-label="Blue"></button>
                <button type="button" class="mm-swatch qr-swatch--custom mm-swatch--custom" data-custom-for="box-fill" aria-label="Custom color">
                  <input type="color" id="mm-box-fill-custom" value="#ffffff" tabindex="-1" aria-hidden="true">
                </button>
              </div>
            </div>

            <label class="mm-check">
              <input type="checkbox" id="mm-box-stroke-toggle" checked>
              <span>Outline</span>
            </label>

            <div class="mm-row" id="mm-box-stroke-controls">
              <div class="mm-field">
                <label>Outline color</label>
                <div class="mm-swatch-row" data-swatches="box-stroke">
                  <button type="button" class="mm-swatch is-active" style="--sw:#000000" data-value="#000000" aria-label="Black"></button>
                  <button type="button" class="mm-swatch" style="--sw:#ffffff" data-value="#ffffff" aria-label="White"></button>
                  <button type="button" class="mm-swatch qr-swatch--custom mm-swatch--custom" data-custom-for="box-stroke" aria-label="Custom color">
                    <input type="color" id="mm-box-stroke-custom" value="#000000" tabindex="-1" aria-hidden="true">
                  </button>
                </div>
              </div>
              <div class="mm-field">
                <label for="mm-box-stroke-width">Width <span class="mm-hint" id="mm-box-stroke-width-val">4px</span></label>
                <input type="range" id="mm-box-stroke-width" min="0" max="16" step="1" value="4">
              </div>
            </div>

            <button type="button" class="mm-btn mm-btn--ghost mm-btn--danger" id="mm-box-delete">Delete text box</button>
          </div>
        </section>

      </aside>

      <main class="mm-stage">
        <div class="mm-canvas-wrap" id="mm-canvas-wrap">
          <canvas id="mm-canvas" width="800" height="600"></canvas>
        </div>
        <p class="mm-status" id="mm-status" role="status" aria-live="polite"></p>
        <button type="button" class="mm-btn mm-btn--primary mm-download" id="mm-download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download PNG
        </button>
      </main>

    </div>
  </div>

<script>
  (function () {
    var v = Date.now();
    document.write('<script src="app.js?v=' + v + '"><' + '/script>');
  })();
</script>
</body>
</html>
