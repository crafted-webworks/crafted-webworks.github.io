<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Filter Studio</title>
<meta name="description" content="Apply photo filters and presets — duotone, vintage, black & white, color grading — with live before/after preview, entirely in your browser.">

<!--
  Fully self-contained tool. Nothing here references the parent site's
  assets/js or assets/css — this whole folder can be copied into another
  project, opened directly from disk, or dropped into an <iframe> and it
  will keep working exactly as it does today.
-->
<script>
  /* Cache-busted on every load — this tool is opened inside an iframe
     that's itself cache-busted (see tools.js → framedTool), and this is
     the other half of that: without it, the *referenced* style.css/
     app.js could still be served from an old cached copy even though the
     document embedding them is fresh. See tools/STANDARDS.md. */
  document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
</head>
<body>

  <div class="pf-app">
    <header class="pf-topbar">
      <div class="pf-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <span>Photo Filter Studio</span>
      </div>
      <div class="pf-header-right">
        <button type="button" class="pf-btn pf-btn--ghost" id="pf-compare">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h4"/><path d="M17 9h4"/><path d="M3 15h4"/><path d="M17 15h4"/></svg>
          Show Original
        </button>
        <button type="button" class="pf-btn pf-btn--primary" id="pf-download">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download PNG
        </button>
      </div>
    </header>

    <main class="pf-main">
      <aside class="pf-sidebar">

        <label class="pf-drop" for="pf-file-input" id="pf-drop-zone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
          <span class="pf-drop-label" id="pf-drop-label">Choose a photo</span>
          <span class="pf-drop-hint">PNG or JPG — or try the sample below</span>
          <input type="file" id="pf-file-input" accept="image/*" hidden>
        </label>

        <div class="pf-field">
          <label>Filter</label>
          <div class="pf-tabs" data-category-tabs role="tablist" aria-label="Filter category" id="pf-category-tabs"></div>
          <div class="pf-preset-grid" id="pf-preset-grid"></div>
        </div>

        <details class="pf-advanced" open>
          <summary>Adjustments</summary>

          <div class="pf-field">
            <label for="pf-brightness">Brightness <span class="pf-hint" id="pf-brightness-val">0</span></label>
            <input type="range" id="pf-brightness" min="-50" max="50" step="1" value="0">
          </div>

          <div class="pf-field">
            <label for="pf-contrast">Contrast <span class="pf-hint" id="pf-contrast-val">0</span></label>
            <input type="range" id="pf-contrast" min="-50" max="50" step="1" value="0">
          </div>

          <div class="pf-field">
            <label for="pf-saturation">Saturation <span class="pf-hint" id="pf-saturation-val">0</span></label>
            <input type="range" id="pf-saturation" min="-50" max="50" step="1" value="0">
          </div>

          <div class="pf-field">
            <label for="pf-vignette">Vignette <span class="pf-hint" id="pf-vignette-val">0</span></label>
            <input type="range" id="pf-vignette" min="0" max="100" step="1" value="0">
          </div>

          <button type="button" class="pf-btn pf-btn--ghost pf-reset-btn" id="pf-reset">Reset adjustments</button>
        </details>
      </aside>

      <section class="pf-preview">
        <div class="pf-canvas-wrap">
          <canvas id="pf-canvas" width="900" height="600"></canvas>
        </div>
        <p class="pf-status" id="pf-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

<script>
  (function () {
    var v = Date.now();
    document.write('<script src="app.js?v=' + v + '"><' + '/script>');
  })();
</script>
</body>
</html>
