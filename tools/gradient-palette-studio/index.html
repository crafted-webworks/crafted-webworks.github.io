<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient &amp; Palette Studio</title>
<meta name="description" content="Build multi-stop linear/radial CSS gradients, generate harmonious 5-color palettes from a base color, and extract a dominant palette from any image — entirely in your browser.">

<!--
  Fully self-contained tool. Nothing here references the parent site's
  assets/js or assets/css — this whole folder can be copied into another
  project, opened directly from disk, or dropped into an <iframe> and it
  will keep working exactly as it does today.
-->
<script>
  /* Cache-busted on every load — see tools/STANDARDS.md. */
  document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
</head>
<body>

  <main class="gps">
    <header class="gps-header">
      <h1 class="gps-title">Gradient &amp; Palette Studio</h1>
      <div class="gps-tabs gps-header-right" data-mode-tabs role="tablist" aria-label="Tool mode">
        <button type="button" class="gps-tab is-active" data-mode="gradient" role="tab" aria-selected="true">Gradient Builder</button>
        <button type="button" class="gps-tab" data-mode="palette" role="tab" aria-selected="false">Palette Generator</button>
        <button type="button" class="gps-tab" data-mode="extract" role="tab" aria-selected="false">Extract from Image</button>
      </div>
    </header>

    <!-- ================================================================
         Gradient Builder
         ================================================================ -->
    <section class="gps-pane is-active" data-mode-pane="gradient">
      <div class="gps-grid">
        <div class="gps-card gps-controls">

          <div class="gps-field">
            <label>Gradient Type</label>
            <div class="gps-card-group" data-choice="gradType">
              <button type="button" class="gps-choice-card is-active" data-value="linear">
                <span class="gps-choice-icon" data-preview="linear"></span>
                <span>Linear</span>
              </button>
              <button type="button" class="gps-choice-card" data-value="radial">
                <span class="gps-choice-icon" data-preview="radial"></span>
                <span>Radial</span>
              </button>
            </div>
          </div>

          <div class="gps-field" data-angle-field>
            <label>Direction</label>
            <div class="gps-angle-dial" data-angle-dial="grad">
              <div class="gps-angle-face" role="slider" aria-label="Gradient angle" aria-valuemin="0" aria-valuemax="360" aria-valuenow="90" tabindex="0">
                <div class="gps-angle-handle"></div>
              </div>
              <span class="gps-angle-value" data-angle-value="grad">90°</span>
            </div>
          </div>

          <div class="gps-field" data-shape-field hidden>
            <label>Radial Shape</label>
            <div class="gps-card-group" data-choice="radialShape">
              <button type="button" class="gps-choice-card is-active" data-value="circle">
                <span class="gps-choice-icon" data-preview="circle"></span>
                <span>Circle</span>
              </button>
              <button type="button" class="gps-choice-card" data-value="ellipse">
                <span class="gps-choice-icon" data-preview="ellipse"></span>
                <span>Ellipse</span>
              </button>
            </div>
          </div>

          <div class="gps-field">
            <label>Color Stops</label>
            <div class="gps-stops-bar" id="gps-stops-bar">
              <div class="gps-stops-track" id="gps-stops-track"></div>
              <!-- stop handles injected here -->
            </div>
            <button type="button" class="gps-btn gps-btn--ghost gps-btn--small" id="gps-add-stop">+ Add Stop</button>
          </div>

          <div class="gps-field" id="gps-stop-editor">
            <label>Selected Stop</label>
            <div class="gps-stop-editor-row">
              <div class="gps-swatch-row" data-swatches="stop" id="gps-stop-swatches">
                <button type="button" class="gps-swatch" style="--sw:#111318" data-value="#111318" aria-label="Black"></button>
                <button type="button" class="gps-swatch" style="--sw:#ffffff" data-value="#ffffff" aria-label="White"></button>
                <button type="button" class="gps-swatch" style="--sw:#e0402b" data-value="#e0402b" aria-label="Red"></button>
                <button type="button" class="gps-swatch" style="--sw:#2b7fff" data-value="#2b7fff" aria-label="Blue"></button>
                <button type="button" class="gps-swatch" style="--sw:#1f9d55" data-value="#1f9d55" aria-label="Green"></button>
                <button type="button" class="gps-swatch" style="--sw:#e2972e" data-value="#e2972e" aria-label="Gold"></button>
                <button type="button" class="gps-swatch gps-swatch--custom" data-custom-for="stop" aria-label="Custom color">
                  <input type="color" id="gps-stop-color" value="#111318" tabindex="-1" aria-hidden="true">
                </button>
              </div>
              <div class="gps-stop-pos-group">
                <label for="gps-stop-pos" class="gps-inline-label">Position</label>
                <input type="number" id="gps-stop-pos" min="0" max="100" step="1" value="0">
                <span class="gps-hint">%</span>
              </div>
              <button type="button" class="gps-btn gps-btn--ghost gps-btn--small" id="gps-remove-stop">Remove</button>
            </div>
          </div>

          <button type="button" class="gps-btn gps-btn--primary" id="gps-copy-css">
            Copy CSS
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <p class="gps-status" id="gps-css-status" role="status" aria-live="polite"></p>
        </div>

        <div class="gps-card gps-preview">
          <div class="gps-preview-box" id="gps-preview-box"></div>
          <code class="gps-css-output" id="gps-css-output"></code>
        </div>
      </div>
    </section>

    <!-- ================================================================
         Palette Generator
         ================================================================ -->
    <section class="gps-pane" data-mode-pane="palette">
      <div class="gps-grid">
        <div class="gps-card gps-controls">
          <div class="gps-field">
            <label>Base Color</label>
            <div class="gps-swatch-row" data-swatches="base">
              <button type="button" class="gps-swatch is-active" style="--sw:#2b7fff" data-value="#2b7fff" aria-label="Blue"></button>
              <button type="button" class="gps-swatch" style="--sw:#e0402b" data-value="#e0402b" aria-label="Red"></button>
              <button type="button" class="gps-swatch" style="--sw:#1f9d55" data-value="#1f9d55" aria-label="Green"></button>
              <button type="button" class="gps-swatch" style="--sw:#e2972e" data-value="#e2972e" aria-label="Gold"></button>
              <button type="button" class="gps-swatch" style="--sw:#8b3dd1" data-value="#8b3dd1" aria-label="Purple"></button>
              <button type="button" class="gps-swatch gps-swatch--custom" data-custom-for="base" aria-label="Custom color">
                <input type="color" id="gps-base-color" value="#2b7fff" tabindex="-1" aria-hidden="true">
              </button>
            </div>
          </div>

          <div class="gps-field">
            <label>Harmony</label>
            <div class="gps-tabs gps-tabs--stack" data-harmony-tabs role="tablist" aria-label="Harmony mode">
              <button type="button" class="gps-tab is-active" data-harmony="complementary" role="tab" aria-selected="true">Complementary</button>
              <button type="button" class="gps-tab" data-harmony="analogous" role="tab" aria-selected="false">Analogous</button>
              <button type="button" class="gps-tab" data-harmony="triadic" role="tab" aria-selected="false">Triadic</button>
              <button type="button" class="gps-tab" data-harmony="monochromatic" role="tab" aria-selected="false">Monochromatic</button>
              <button type="button" class="gps-tab" data-harmony="splitComplementary" role="tab" aria-selected="false">Split-Complementary</button>
            </div>
          </div>

          <button type="button" class="gps-btn gps-btn--primary" id="gps-generate-palette">
            Generate Palette
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>

        <div class="gps-card gps-preview">
          <div class="gps-palette-strip" id="gps-palette-strip"></div>
          <button type="button" class="gps-btn gps-btn--ghost" id="gps-download-palette">Download Palette as PNG</button>
        </div>
      </div>
    </section>

    <!-- ================================================================
         Extract from Image
         ================================================================ -->
    <section class="gps-pane" data-mode-pane="extract">
      <div class="gps-grid">
        <div class="gps-card gps-controls">
          <div class="gps-field">
            <label class="gps-drop" for="gps-image-file">
              <span class="gps-drop-label" id="gps-image-label">Upload an image</span>
              <span class="gps-drop-hint">PNG or JPG</span>
              <input type="file" id="gps-image-file" accept="image/*" hidden>
            </label>
          </div>
          <div class="gps-field">
            <label for="gps-swatch-count">Colors to extract <span class="gps-hint" id="gps-swatch-count-val">6</span></label>
            <input type="range" id="gps-swatch-count" min="4" max="8" step="1" value="6">
          </div>
          <p class="gps-status" id="gps-extract-status" role="status" aria-live="polite"></p>
        </div>

        <div class="gps-card gps-preview">
          <div class="gps-image-preview-wrap">
            <canvas id="gps-image-canvas" hidden></canvas>
            <img id="gps-image-preview" alt="Uploaded image preview" hidden>
            <p class="gps-empty-note" id="gps-image-empty">No image uploaded yet</p>
          </div>
          <div class="gps-palette-strip" id="gps-extract-strip"></div>
          <button type="button" class="gps-btn gps-btn--ghost" id="gps-download-extract">Download Palette as PNG</button>
        </div>
      </div>
    </section>

  </main>

<script>
  (function () {
    var v = Date.now();
    document.write('<script src="app.js?v=' + v + '"><' + '/script>');
  })();
</script>
</body>
</html>
